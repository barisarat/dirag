# ask corpora config (example).
#
# Each [section] is a corpus: a folder of PDFs with its own index and its own
# model. The corpus is chosen with `--corpus` (or `ask q -c <name>`); without
# it, the top-level `default` is used. When only one corpus is defined, it is
# the default automatically. Copy this file to your real config and edit the
# paths. The tool looks for the config in this order:
#   1. $ASK_CORPORA (explicit path)
#   2. ./corpora.toml (current directory)
#   3. ~/.config/ask/corpora.toml
#
# `model` is a 'provider:model' reference and is the ONLY thing that decides
# where a question is answered:
#   - "openai:<model-id>"  an OpenAI-compatible cloud model. Needs
#     OPENAI_API_KEY (and optionally OPENAI_BASE_URL for Groq/OpenRouter/etc.).
#     A missing key is a hard error, never a silent fallback.
#   - "local:<ollama-tag>" a local model served by Ollama. Never reads the API
#     key; nothing leaves the machine.
# Embeddings are always computed locally (fastembed), whatever the model.

default = "library"

[library]
path = "~/vault/library"
retriever = "vector"
model = "openai:gpt-5-nano"   # EDIT to the exact model id your key serves.

# A corpus answered entirely on your machine (requires Ollama + a pulled model):
#
# [private]
# path = "~/documents/confidential"
# retriever = "vector"
# model = "local:qwen2.5:3b"
