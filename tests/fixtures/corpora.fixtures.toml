# Fixture corpora config for local end-to-end testing.
#
# Points the corpus at the tiny PDF fixtures so `ask` can run against a real
# corpus without touching your real library. Run from the repo root, e.g.:
#   uv run ask index --config tests/fixtures/corpora.fixtures.toml
#   uv run ask q "how are backups pruned?" --config tests/fixtures/corpora.fixtures.toml

default = "library"

[library]
path = "tests/fixtures/library"
retriever = "vector"
model = "openai:gpt-5-nano"   # edit to the exact model id your key serves,
                              # or use "local:qwen2.5:3b" with Ollama running
