[project]
name = "ragshelf"
version = "0.1.0"
description = "Local CLI for grounded, page-cited question-answering over folders of PDFs."
license = { text = "MIT" }
authors = [{ name = "Baris Arat", email = "aratbaris98@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "openai>=1.40",
    # PDF parse, local CPU embeddings, vector store.
    "pymupdf>=1.24",
    "fastembed>=0.3",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
ask = "ask.cli:app"

[project.urls]
Repository = "https://github.com/barisarat/ragshelf"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
